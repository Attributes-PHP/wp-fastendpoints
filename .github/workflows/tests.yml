name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  tests:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [ '8.1' ]
        wp_version: [ '6.0', '6.9', '7.1' ]

    name: WordPress ^${{ matrix.wp_version }} - PHP ${{ matrix.php }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer:v2

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'

    - name: Install JS dependencies
      run: npm ci

    - name: Setup WordPress test environment
      run: composer run-script setup:wp:${{ matrix.wp_version }}

    - name: Install PHP dependencies inside wp-env
      run: composer run-script test:setup

    - name: Fix vendor file ownership
      run: sudo chown -R $(id -u):$(id -g) vendor

    - name: Run lint
      run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/fastendpoints -- ./vendor/bin/pint --test

    - name: Run test suite
      run: composer run-script test:unit && composer run-script test:integration
