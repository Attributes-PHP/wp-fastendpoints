name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  tests:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [ '8.1' ]
        wp_version: [ '6.0.18', '6.9.11', '7.1.4' ]

    name: WordPress ${{ matrix.wp_version }} - PHP ${{ matrix.php }}

    env:
      WP_ENV_CORE: https://wordpress.org/wordpress-${{ matrix.wp_version }}.zip

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer:v2
        coverage: pcov

    - name: Install PHP dependencies
      run: composer update --prefer-stable --no-interaction --no-progress --ansi

    - name: Install Node dependencies
      run: npm install

    - name: Run test suite
      run: composer run-script test
